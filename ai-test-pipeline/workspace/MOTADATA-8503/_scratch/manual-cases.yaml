- id: "TC-8503-06"
  title: "Edit existing Threshold policy renders in unified screen and persists"
  traces_to: ["A1", "F1", "B4"]
  risk: "high"
  module: "APM/RUM/NetRoute (one with an existing Threshold policy)"
  preconditions:
    - "an existing Threshold policy exists"
  steps:
    - "navigate: Settings > Policy Settings"
    - "open an existing Threshold policy (edit)"
    - "verify it renders in unified layout, Threshold card selected"
    - "update a severity threshold value"
    - "click: Save / Update Policy"
    - "reopen the same policy"
  expected:
    - "updated value persisted (F1)"

- id: "TC-8503-07"
  title: "Backward compatibility — existing Anomaly/Forecast policies still function"
  traces_to: ["F2", "A3"]
  risk: "edge"
  module: "any"
  preconditions:
    - "a pre-existing Anomaly or Forecast policy exists"
  steps:
    - "navigate: Settings > Policy Settings"
    - "locate an existing Anomaly/Forecast policy"
    - "open it"
  expected:
    - "opens on the matching card in the unified screen; no error; values intact (F2)"

- id: "TC-8503-08"
  title: "Validation — Policy Name and Counter gating (validate-on-submit)"
  traces_to: ["B1", "B2"]
  risk: "smoke"
  module: "Metric"
  preconditions:
    - "logged in"
  steps:
    - "navigate: Settings > Policy Settings > Create Policy (Metric)"
    - "with empty form, click Create Policy"
    - "observe required fields highlighted; no policy created"
    - "fill Policy Name only; leave Counter empty; click Create Policy"
  expected:
    - "Create Policy stays enabled but submit is blocked while required fields empty"
    - "Counter required on all four cards (B2)"
